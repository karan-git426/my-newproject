<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #dadbd3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Main Container */
        .chat-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background: #efeae2;
            display: flex;
            flex-direction: column;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        @media (min-width: 600px) {
            .chat-container {
                height: 90vh;
                border-radius: 10px;
            }
        }

        /* Header Section */
        .chat-header {
            background-color: #008069;
            color: white;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background-color: #ccc;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #555;
        }

        .user-info h3 {
            font-size: 16px;
            font-weight: 600;
        }

        .user-info p {
            font-size: 12px;
            color: #d1f4cc;
        }

        /* Chat Body / Messages Area */
        .chat-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-blend-mode: overlay;
            background-color: rgba(239, 234, 226, 0.9);
        }

        .message {
            max-width: 75%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14.5px;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
        }

        .incoming {
            background-color: #ffffff;
            align-self: flex-start;
            border-top-left-radius: 0;
        }

        .outgoing {
            background-color: #d9fdd3;
            align-self: flex-end;
            border-top-right-radius: 0;
        }

        .time {
            font-size: 10px;
            color: #667781;
            text-align: right;
            margin-top: 4px;
            display: block;
        }

        /* Input Area Section */
        .chat-footer {
            background-color: #f0f2f5;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-footer input {
            flex: 1;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        .send-btn {
            background-color: #00a884;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background-color: #008069;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="avatar">S</div>
            <div class="user-info">
                <h3>Siva</h3>
                <p>Online</p>
            </div>
        </div>

        <!-- Chat Messages -->
        <div class="chat-body" id="chatBody">
            <div class="message incoming">
                ஹலோ! எப்படி இருக்கீங்க? 😊
                <span class="time">10:30 AM</span>
            </div>
            <div class="message outgoing">
                நான் நல்லா இருக்கேன்! நீங்க?
                <span class="time">10:31 AM</span>
            </div>
        </div>

        <!-- Input Area -->
        <div class="chat-footer">
            <input type="text" id="messageInput" placeholder="Type a message" onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const chatBody = document.getElementById('chatBody');
            const messageText = input.value.trim();

            if (messageText !== "") {
                // Create message div
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message outgoing';

                // Get Current Time
                const now = new Date();
                let hours = now.getHours();
                let minutes = now.getMinutes();
                const ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12;
                hours = hours ? hours : 12; // 0 should be 12
                minutes = minutes < 10 ? '0'+minutes : minutes;
                const timeString = hours + ':' + minutes + ' ' + ampm;

                // Add text and time
                messageDiv.innerHTML = messageText + `<span class="time">${timeString}</span>`;

                // Append to chat body
                chatBody.appendChild(messageDiv);

                // Clear input
                input.value = "";

                // Scroll to bottom
                chatBody.scrollTop = chatBody.scrollHeight;

                // Auto reply simulation (Optional)
                setTimeout(() => {
                    sendAutoReply();
                }, 1000);
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function sendAutoReply() {
            const chatBody = document.getElementById('chatBody');
            const replyDiv = document.createElement('div');
            replyDiv.className = 'message incoming';
            
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0'+minutes : minutes;
            
            replyDiv.innerHTML = "சூப்பர்! 👍" + `<span class="time">${hours}:${minutes} ${ampm}</span>`;
            
            chatBody.appendChild(replyDiv);
            chatBody.scrollTop = chatBody.scrollHeight;
        }
    </script>

</body>
</html>
